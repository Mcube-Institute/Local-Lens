<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalLens</title>
    <link rel="stylesheet" href="../static/css/forget.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>

<body>
<section class="hero">
    <div class="formwrap p-4">

    <h2 class="authTitle">Reset Your Password</h2>
      <p class="authSubtitle">Securely reset your LocalLens account password.</p>

        <form class="otpWrap mb-4" id="getOtp">
            <div class="form-floating flex-grow-1 me-2">
                <input type="email" class="form-control" id="email" name="email"
                    placeholder="someone@yahoo.com" required>
                <label for="email">Email Address</label>
            </div>
            <button type="submit" class="btn btn-primary">Get OTP</button>
        </form>

        <form id="resetPassword">
            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="otp" name="otp"
                    maxlength="6" minlength="6"
                    inputmode="numeric" pattern="[0-9]{6}"
                    placeholder="123456" required>
                <label for="OTP">OTP</label>
            </div>

            <div class="form-floating mb-3">
                <input type="password" class="form-control"
                    id="newPassword" name="newPassword" placeholder="New Password" required>
                <label for="newPassword">New Password</label>
            </div>

            <div class="form-floating mb-3">
                <input type="password" class="form-control"
                    id="confirmPassword" name="confirmPassword" placeholder="Confirm Password" required>
                <label for="confirmPassword">Confirm Password</label>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Change Password
            </button>
        </form>

        <p class="authFooter">
        <a href="/login" class="px-1 text-nowrap">Login</a>|
        <a href="/" class="ps-1">Home</a>
      </p>
    </div>

    </div>
</section>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script src="https://code.jquery.com/jquery-4.0.0.min.js"
        integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>

    <script src="https://code.jquery.com/ui/1.14.1/jquery-ui.min.js"
        integrity="sha256-AlTido85uXPlSyyaZNsjJXeCs07eSv3r43kyCVc8ChI=" crossorigin="anonymous"></script>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

    <script src="../static/js/forget.js"></script>
</body>

</html>
